# E2E verification override for the canvas MCP suite (e2e/canvas-mcp.spec.ts).
#
# Three deviations from docker-compose.yml, all required, all explained:
#
# 1. PROXY PORT. Host port 8080 is unbindable in this WSL2 environment (Docker
#    Desktop answers "/forwards/expose returned 500"), so the published port
#    moves to 18080. Bring the stack up with PUBLIC_ORIGIN=http://localhost:18080
#    to match: OAuth audience validation compares the `resource` request
#    parameter against MCP_RESOURCE_URI, and any mismatch 401s every MCP call.
#
# 2. APP BUILD WITH VITE_E2E_HOOKS=1. Canvas content paints to a single <canvas>
#    element — there are no DOM nodes, no data-testid attributes, nothing
#    Playwright can query. The app publishes its live scene at
#    `window.__canvasEngine` for exactly this reason, but gates the publish on
#    `import.meta.env.DEV || VITE_E2E_HOOKS === '1'` so users never receive it
#    (src/components/canvas/canvas-test-hook.ts). Vite reads VITE_* at BUILD
#    time, and compose `environment:` only sets RUNTIME variables, so the
#    variable has to reach `bun run build` inside the image build. The app
#    Dockerfile declares `ARG VITE_E2E_HOOKS=` (empty by default, so production
#    images omit the hook); this override sets that build arg to 1.
#
# 3. SEED SCRIPTS MOUNTED. The app's .dockerignore leaves e2e/ out of every
#    image, but e2e/stack.ts runs the app's seed scripts inside the app
#    container (`bun run e2e/seed.ts`). The app's e2e/ folder is mounted
#    read-only so the seeds exist without shipping them in the production image.
#
# Bring the e2e stack up (from this directory):
#   PUBLIC_ORIGIN=http://localhost:18080 \
#     docker compose -p lizverify -f docker-compose.yml -f docker-compose.e2e.yml up -d --build
# Tear it down:
#   docker compose -p lizverify -f docker-compose.yml -f docker-compose.e2e.yml down -v
services:
  app:
    build:
      context: ../liz-whiteboard
      args:
        VITE_E2E_HOOKS: "1"
    volumes:
      - ../liz-whiteboard/e2e:/app/e2e:ro

  # The renderer is what e2e/board-image-mcp.spec.ts drives through the MCP
  # tools. It builds from the same context as docker-compose.yml; it is restated
  # here so the e2e stack names every service it depends on. Still no `ports`:
  # DevTools stays on the compose network.
  renderer:
    build:
      context: ./deploy/renderer
    shm_size: 1gb

  proxy:
    ports: !override
      - "127.0.0.1:18080:8080"
